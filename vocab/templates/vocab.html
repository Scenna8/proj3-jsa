<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html> <head>

<!-- Bootstrap requires the following three meta tags to appear first -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Vocabulary Anagram</title>

<!-- Javascript and Cascading Style Sheets (css) libraries -->
<!-- mostly from content delivery networks                 -->

<!-- jquery; CDN load is usually quick because it's likely cached -->
<script type="text/javascript"
     src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js">
</script>

<!-- Bootstrap stylesheet let's us have a 'responsive' layout; -->
<!-- 12 column grid rearranges itself for smaller screens or windows. -->

<!-- per http://getbootstrap.com/getting-started/  -->
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet"
 href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
 integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7"
  crossorigin="anonymous">

<!-- Latest compiled and minified JavaScript -->
<script
 src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"
 integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS"
 crossorigin="anonymous">
</script>

<!-- Our own css file.  Note how we can link directly here and not -->
<!-- write any routing code in the Flask application. -->
<link rel="stylesheet" href="/static/jumble.css" />

</head>

<body>
<div class="container">

  <div class="row">
    <div class="col-xs-6 text-center">
      <h1>Words</h1>
    </div>
  </div>
<!-- Vocabularly words layed out in 6 columns;
  -- bootstrap may collapse to fewer columns and
  -- more rows if the window is narrow.
  -->
<div class="row">
  {% for word in g.vocab %}
    <div class="col-xs-2 text-center"> {{ word }} </div>
    {% if loop.index is divisibleby 3 %}
    </div> <!-- row -->
    <div class="row">
    {% endif %}
  {% endfor %}
</div> <!-- row -->

<br />

<div class="row">
  <div class="col-xs-6 text-center">
   Use letters from
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center lead">
    <strong>{{ session.jumble }}</strong>
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center">
    to spell {{session.target_count}} words from the list.
  </div> <!-- col -->
</div> <!-- row -->
<br />
<div class="row">
  <div class="col-xs-6 text-center">
  <form id="entry">
    <label for="attempt">Word:</label>
    <input id="attempt" name="attempt" type="text" width="15"
      autocomplete="off"  autofocus />
  </form>
</div></div>

<br />

<!-- Filled in by JavaScript as matches are found -->
<div id="found" {% if not session.matches %}style="display: none;"{% endif %}>
<h2>You found </h2>
<p id="results">
  {% for match in session.matches %}
  {{ match }}
  {% endfor %}
</p>
</div>

<!-- Mismatch, already found, etc., inserted by JavaScript -->
<p id="message" class="message"> </p>

<script>

// Pressing Enter submits the form; instead of a normal submission,
// check the word through Ajax and also report if it isn't on the list.
$("#entry").submit( function(event) {
   event.preventDefault();
   checkWord(true);
  });

// On each keystroke, send the current contents of the input
// field to the server, which tells us whether it is a new match.
// We use 'keyup' because the input field has been updated by then.
// Non-character keys like shift also trigger it, but that just
// re-checks the same text, which is harmless.  Enter is handled
// by the submit handler above, so we skip it here.
$("#attempt").keyup(function(event) {
   if (event.which == 13) { return; }
   checkWord(false);
   });

// Ask the server about the current contents of the input field.
// 'final' is true when the user pressed Enter.
function checkWord(final) {
   var txt = $("#attempt").val();  // Current content of the input field

   $.getJSON( "/_check", { text: txt, final: final },
              function(data) {
                var rslt = data.result;
                if (rslt.solved) {
                   window.location.href = rslt.success_url;
                   return;
                }
                if (rslt.new_match) {
                   $("#results").text(rslt.matches.join(" "));
                   $("#found").show();
                   $("#attempt").val("");
                }
                $("#message").text(rslt.message);
               }
           ).fail(function() {
                $("#message").text("Can't reach the server; is it running?");
           });
}
</script>



 </div> <!-- container -->
</body> </html>
